[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arrayevidence"
version = "0.1.0"
description = "Deterministic, assay-aware genotype-array interpretation"
requires-python = ">=3.10"

[project.scripts]
arrayevidence = "arrayevidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

markers = [
    "integration: tests requiring authorized local datasets",
]
